name: Build and publish

on:
  workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_pages:
    name: Build GitHub Pages Website
    runs-on: ubuntu-latest
    steps:
    - name: Perform Checkout
      uses: actions/checkout@v4

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Install Ant + Ant-Contrib
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ant ant-contrib

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: pip install rdflib

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Prepare Data
      run: |
        ant -f ./build.xml

    - name: Build search index
      run: npx pagefind --site html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./html

  deploy:
    name: Deploy to GitHub Pages
    needs: build_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4